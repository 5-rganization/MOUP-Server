name: Deploy to Raspberry Pi (Docker)

on:
  push:
    branches:
      - develop # develop 브랜치에 푸시될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest # GitHub Actions 실행 환경

    steps:
      - name: Deploy to Raspberry Pi via SSH
        # SSH 접속 및 배포 스크립트 실행
        run: |
          sshpass -p "${{ secrets.RPI_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.RPI_PORT }} ${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }} << 'EOF'
          
            # === 스크립트 시작 ===
            set -e # 오류 발생 시 즉시 중지
            
            # 1. 프로젝트 디렉터리로 이동
            echo "Navigating to project directory..."
            cd /home/${{ secrets.RPI_USER }}/MOUP-Server
            
            # 2. 최신 코드 받기 (SSH 키 설정 포함)
            echo "Pulling latest code from Git..."
            eval "$(ssh-agent -s)"
            echo "${{ secrets.RPI_DEPLOY_KEY }}" | ssh-add -
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            ssh-agent -k
            
            # 3. .env 파일 생성 (Secrets -> .env)
            #    KEYSTORE_PASSWORD·ADMIN_AUTH_TOKEN은 소비처가 없어 뺐다(TLS는 nginx, 배치는 @Scheduled).
            #    FIREBASE_ACCOUNT_KEY_PATH는 compose가 마운트 경로로 고정한다.
            echo "Creating .env file..."
            # [중요] Docker 내부 통신용 주소로 설정
            echo "DATABASE_URL=jdbc:mysql://mysql:3306/${{ secrets.DATABASE_NAME }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul" > .env
            echo "DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}" >> .env
            echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> .env
            echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
            echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
            echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env
            echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" >> .env
            echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
            echo "APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}" >> .env
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> .env
            echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}" >> .env
            echo "APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}" >> .env
            echo "APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}" >> .env
            
            # 4. 인프라 컨테이너(nginx·mysql·redis)만 맞춘다. server는 Jenkins가 develop-N 태그로 교체한다.
            #    예전에는 여기서 TAG 없이 전체를 up 해서, Jenkins가 고정한 develop-N 컨테이너를
            #    :latest로 다시 만들었다(두 파이프라인이 같은 컨테이너를 다른 태그로 다툼).
            #    .env가 바뀌면 다음 Jenkins 배포의 up이 server를 새 설정으로 다시 만든다.
            echo "Starting Docker Compose deployment..."
            docker compose -f docker-compose.dev.yml up -d nginx mysql redis
            echo "Deployment complete."

            # 5. 태그 없는(dangling) 이미지만 정리한다. 예전의 -a는 지금 안 쓰는 develop-N 이미지까지
            #    지워 TAG=로 롤백할 수 없게 만들었다.
            echo "Pruning dangling Docker images..."
            docker image prune -f
            
            # 6. 탈퇴 사용자 영구 삭제는 서버 내부 @Scheduled로 옮겼다.
            #    여기 있던 crontab 등록 블록은 통째로 주석 처리된 상태였고,
            #    cron이 가리키던 스크립트는 그 경로에 존재하지도 않았다.
            #    (delete_old_users.log에 No such file or directory만 쌓여 있었다)
            #    자세한 경위는 SchedulerConfig 주석 참고.

            # === 스크립트 종료 ===
          EOF
