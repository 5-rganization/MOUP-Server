name: moup

# Docker 기본 json-file 드라이버는 로그를 무한정 쌓는다. 라즈베리파이 SD 카드에서는
# 이게 서버가 죽는 방식이다 — 디스크가 차면 MySQL이 먼저 멈춘다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. Nginx (내부 리버스 프록시)
  moup-nginx:
    image: nginx:1.27-alpine
    container_name: moup-nginx
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    networks:
      - default
      - npm-connect
    logging: *default-logging
    restart: unless-stopped

  # 2. Spring Server (API 서버)
  server:
    # Jenkins가 TAG를 export한다 (main 빌드). 예전에는 태그가 없어 항상 :latest를
    # 당겼고, 그래서 프로덕션이 develop 이미지를 받았다. export TAG는 죽은 코드였다.
    image: neoskycladdocker/moup:${TAG:-stable}
    env_file:
      - ./.env # 루트의 .env 파일 로드
    environment:
      # .env의 값보다 우선한다. 키 파일은 아래 volumes로 들어온다.
      FIREBASE_ACCOUNT_KEY_PATH: file:/run/secrets/firebase-key.json
    volumes:
      # Firebase 서비스 계정 키는 이미지에 넣지 않고 서버의 파일을 마운트한다(스코프 7 C7).
      # 예전에는 Jenkins가 빌드 전에 키를 src/main/resources/keys/에 복사해 jar → public 이미지에
      # 들어갔다. 이 파일이 없으면 Docker가 같은 경로에 빈 디렉터리를 만들어 서버가 뜨지 않는다.
      - ./secrets/firebase-key.json:/run/secrets/firebase-key.json:ro
    healthcheck:
      # 액추에이터 헬스(/health)는 DB·Redis까지 본다. Spring 기동에 약 1분 걸려 start_period를 넉넉히 둔다.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    expose:
      - "8080" # 내부 Nginx 연결용 포트
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped

  # 3. MySQL (데이터베이스)
  mysql:
    image: mysql:8.0
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD} # .env 파일에서 변수 주입
      MYSQL_DATABASE: ${DATABASE_NAME}          # .env 파일에서 DB 이름 주입
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=Asia/Seoul
    healthcheck: # server가 기다릴 healthcheck
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # 홈서버 프로젝트 폴더 내 ./data/mysql에 저장
      - moup-db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d # 초기화 스크립트 (선택 사항)
    # ports는 운영 환경에서 노출하지 않음 (로컬 테스트 필요시 임시 추가)
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped # 운영 환경 재시작 정책

  # 4. Redis (캐시 서버)
  redis:
    image: redis:7-alpine
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    command: redis-server --requirepass ${REDIS_PASSWORD} # .env에서 비번 관리
    volumes:
      # 홈서버 프로젝트 폴더 내 ./data/redis에 저장
      - ./data/redis:/data
    networks:
      - default
    logging: *default-logging
    restart: unless-stopped # 운영 환경 재시작 정책

networks:
  default:
    name: moup-internal-net
  npm-connect:
    external: true
    name: proxy-net

volumes:
  moup-db-data:
