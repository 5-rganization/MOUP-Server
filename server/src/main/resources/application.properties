spring.application.name=MOUP_Server

# Server Settings
server.port=8080
server.ssl.enabled=false
server.forward-headers-strategy=NATIVE

# .env file imports
spring.config.import=optional:file:.env[.properties]

# Health Check Settings
# 예전 /health는 문자열 "OK"를 그대로 돌려주는 컨트롤러였다. DB나 Redis가 죽어도
# 200 OK를 반환해, 헬스체크가 통과하는 동안 모든 요청이 실패할 수 있었다.
# 액추에이터는 이미 의존성에 있었고 설정만 없었다 — DataSource·Redis 인디케이터가
# 자동 구성되어 실제로 연결을 확인하고, 하나라도 죽으면 503을 반환한다.
#
# base-path를 /로 두어 기존 /health URL을 유지한다. 외부 모니터를 건드리지 않는다.
# ⚠️ 응답 본문이 "OK"에서 {"status":"UP"}으로 바뀐다. 본문 문자열을 검사하는
#    모니터가 있다면 상태 코드 검사로 바꿔야 한다.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
# 미인증 요청에는 UP/DOWN만 준다 — 어느 컴포넌트가 죽었는지는 정찰 정보다.
# 관리자 토큰으로 부르면 상세가 나온다.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ROLE_ADMIN

# Log Settings
# 프로덕션에서 SQL·web DEBUG가 켜져 있었다. 로그 로테이션도 없어 SD 카드가 찰 때까지
# 자랐고, 쿼리 파라미터가 그대로 찍혀 개인정보가 로그로 새어 나갔다.
# SWAGGER_ENABLED와 같은 방식으로 환경변수 기본값을 안전한 쪽에 둔다.
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}

# Mybatis Settings
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:/mappers/**/*.xml

# Database Settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis Settings
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Firebase Settings
firebase.account-key.path=${FIREBASE_ACCOUNT_KEY_PATH}

# Swagger Settings
# Swagger/OpenAPI는 기본 비활성. SWAGGER_ENABLED=true 인 환경에서만 노출한다.
# 무인증 /v3/api-docs 한 번이면 전체 API 표면·관리자 경로·역할 체계가 그대로 나간다.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.persist-authorization=true

# JWT Settings
jwt.secret.key=${JWT_SECRET_KEY}
## 20 minutes
jwt.access.token.expiration=1200000
## 1 week
jwt.refresh.token.expiration=604800000

# AWS S3 Settings
cloud.aws.s3.bucket=${S3_BUCKET_NAME}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false

# File Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OAuth Settings
## Google Settings
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

## Apple Settings
apple.client.id=${APPLE_CLIENT_ID}
apple.team.id=${APPLE_TEAM_ID}
apple.key.id=${APPLE_KEY_ID}
apple.private.key=${APPLE_PRIVATE_KEY}
apple.redirect.uri=${APPLE_REDIRECT_URI}

# User Settings
## 3 days
user.delete.grace-period=3
# 소셜 연동 해제(revoke)를 이 기간 동안 실패하면 포기하고 기록 후 삭제한다.
# 데이터를 무한정 보관하지 않기 위한 상한이다.
user.delete.revoke-give-up-period=30

# Workplace Settings
## Workplace creation limit
workplace.creation.limit=20
# 초대코드 무차별 대입 방어. 실패한 조회만 센다.
# 10분 20회면 정상 사용자는 걸리지 않고, 무표적 공격의 기대 소요는 100배가 된다.
workplace.invite-code.max-failed-attempts=20
workplace.invite-code.attempt-window-minutes=10

# Salary Settings
## 1. Rate Settings
salary.rates.national-pension=0.045
salary.rates.health-insurance=0.03545
salary.rates.long-term-care-insurance=0.1295
salary.rates.employment-insurance=0.009
salary.rates.simple-income-tax=0.033
## 2. Threshold Settings
salary.thresholds.insurance-min-hours=60
