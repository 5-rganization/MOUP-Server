spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트 시작 시 테이블 생성 -> 종료 시 삭제
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 쿼리를 예쁘게 줄바꿈해서 보여줌 (추천)
