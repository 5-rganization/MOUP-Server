spring.application.name=MOUP_Server_Test
spring.profiles.active=test
server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=test

firebase.account-key.path=classpath:unused-firebase-key.json

cloud.aws.s3.bucket=test-bucket
cloud.aws.credentials.access-key=test-access-key
cloud.aws.credentials.secret-key=test-secret-key
cloud.aws.region.static=ap-northeast-2

jwt.secret.key=test-jwt-secret-key-that-is-at-least-thirty-two-bytes
jwt.access.token.expiration=1200000
jwt.refresh.token.expiration=604800000

google.client.id=test-google-client
google.client.secret=test-google-secret
google.redirect.uri=http://localhost/google/callback

apple.client.id=test-apple-client
apple.team.id=test-apple-team
apple.key.id=test-apple-key
apple.private.key=test-private-key
apple.redirect.uri=http://localhost/apple/callback

user.delete.grace-period=3
workplace.creation.limit=20

salary.rates.national-pension=0.045
salary.rates.health-insurance=0.03545
salary.rates.long-term-care-insurance=0.1295
salary.rates.employment-insurance=0.009
salary.rates.simple-income-tax=0.033
salary.thresholds.insurance-min-hours=60
