user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # dev는 80/443을 호스트에 직접 노출하므로 $remote_addr이 이미 실제 클라이언트 IP다.
    # (prod는 NPM 뒤라 real_ip 설정이 추가로 필요하다)

    # /auth/* IP 단위 레이트 리밋 (스코프 7 I17의 나머지 절반 — 나머지 절반인
    # 초대코드 무차별 대입은 Redis로 앱에서 막는다).
    #
    # 여기서 막는 건 자격증명 대입이 아니다 — 소셜 로그인이라 대입할 비밀번호가 없다.
    # 문제는 /auth/login 한 번이 구글·애플로 나가는 아웃바운드 HTTPS 호출 하나라는
    # 점이다. 초당 수십 번이면 라즈베리파이가 그대로 눕는다. 증폭 공격을 막는 것이다.
    #
    # 60r/m + burst 60. 정상 클라이언트는 앱 실행 시 로그인 1회,
    # 액세스 토큰 만료(20분)마다 갱신 1회다. 통신사 CGNAT로 IP를 공유해도 여유가 있다.
    # 429가 실사용자에게 보이면 rate를 올린다 — 값 하나만 바꾸면 된다.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    limit_req_status 429;   # 기본값 503은 "서버 고장"으로 읽힌다
    limit_req_log_level warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream moup_backend {
        server moup-server-dev:8080;
    }

    # --- 서버 블록 1: HTTP(80) -> HTTPS(443) 강제 리디렉션 ---
    server {
        listen 80;
        server_name test.moup-server.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot; 
        }

		location / {
		    return 301 https://$host$request_uri;
		}
    }

    # --- 서버 블록 2: HTTPS(443) 리버스 프록시 (메인) ---
	server {
	    listen 443 ssl;
	    http2 on; 
	
	    server_name test.moup-server.com;
	
			ssl_certificate /etc/nginx/ssl/fullchain.pem; # 예시 도메인
			ssl_certificate_key /etc/nginx/ssl/privkey.pem; # 예시 도메인
	
			ssl_protocols TLSv1.2 TLSv1.3;
			ssl_ciphers HIGH:!aNULL:!MD5;
			ssl_prefer_server_ciphers off; # 클라이언트 Cipher 우선 (HTTP/2 권장)
	
	    client_max_body_size 10M;
	
	    # 접두사 매칭은 가장 긴 것이 이기므로 아래 location / 보다 우선한다.
	    location /auth/ {
	        limit_req zone=auth_limit burst=60 nodelay;

	        proxy_pass http://moup_backend;

	        proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
	        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;

	        proxy_read_timeout 300s;
	        proxy_connect_timeout 75s;
	        proxy_send_timeout 300s;
	    }

	    location / {
	        proxy_pass http://moup_backend;
	
	        proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
	        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme; # Nginx가 SSL 처리하므로 여기선 "https"가 전달됨
	
	        proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
	
	        proxy_read_timeout 300s;
	        proxy_connect_timeout 75s;
	        proxy_send_timeout 300s;
	    }
	}
}

