user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 이 nginx는 NPM 뒤에 있어 $remote_addr이 항상 NPM의 컨테이너 IP다.
    # 그대로 레이트 리밋을 걸면 전체 사용자가 버킷 하나를 공유해 통째로 막힌다.
    # 사설 대역만 신뢰하면 되는 이유: 이 서버는 호스트에 포트를 열지 않아
    # 내부 도커 네트워크(proxy-net) 밖에서는 접속 자체가 불가능하다.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # /auth/* IP 단위 레이트 리밋 (스코프 7 I17의 나머지 절반 — 나머지 절반인
    # 초대코드 무차별 대입은 Redis로 앱에서 막는다).
    #
    # 여기서 막는 건 자격증명 대입이 아니다 — 소셜 로그인이라 대입할 비밀번호가 없다.
    # 문제는 /auth/login 한 번이 구글·애플로 나가는 아웃바운드 HTTPS 호출 하나라는
    # 점이다. 초당 수십 번이면 라즈베리파이가 그대로 눕는다. 증폭 공격을 막는 것이다.
    #
    # 60r/m + burst 60. 정상 클라이언트는 앱 실행 시 로그인 1회,
    # 액세스 토큰 만료(20분)마다 갱신 1회다. 통신사 CGNAT로 IP를 공유해도 여유가 있다.
    # 429가 실사용자에게 보이면 rate를 올린다 — 값 하나만 바꾸면 된다.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    limit_req_status 429;   # 기본값 503은 "서버 고장"으로 읽힌다
    limit_req_log_level warn;

    server {
        listen 80;
        server_name home.moup-server.com localhost;

        # 예전에는 0(무제한)이었다. 스프링이 10MB에서 거부해도 nginx가 본문을
        # 전부 받아 버퍼링한 뒤라, 거부되기 전에 SD 카드가 먼저 찬다.
        client_max_body_size 10M;


        # location 접두사 매칭은 가장 긴 것이 이기므로 아래 location / 보다 우선한다.
        location /auth/ {
            limit_req zone=auth_limit burst=60 nodelay;

            proxy_pass http://server:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            proxy_pass http://server:8080;

            # NPM이 넘겨준 헤더 정보를 그대로 유지
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
